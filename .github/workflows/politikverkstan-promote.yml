name: Promote tested Politikverkstan release

on:
  workflow_run:
    workflows: ["Politikverkstan quality"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: politikverkstan-promote-release
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      ${{ github.repository == 'politikverkstan/politikverkstan' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
          github.event.workflow_run.head_repository.full_name == 'politikverkstan/politikverkstan' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Advance release branch only for successful current main commit
        shell: bash
        env:
          PASSED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash politikverkstan-lekeberg/ops/promote-tested-release.sh
