name: Politikverkstan 1.4 quality

on:
  push:
    branches: [main]
    paths:
      - "politikverkstan-lekeberg/**"
      - ".github/workflows/politikverkstan-ci.yml"
  pull_request:
    paths:
      - "politikverkstan-lekeberg/**"
      - ".github/workflows/politikverkstan-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: politikverkstan-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build and tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: politikverkstan-lekeberg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm generated files match source
        run: python build.py --check
      - name: Test fail-closed build
        run: python tests/test-build.py
      - name: Run all Node regressions
        run: npm test
      - name: Verify data migration contracts
        run: python tests/test-migrations.py

  browser:
    name: Chromium browser regressions
    needs: quality
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: politikverkstan-lekeberg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser-test dependencies
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.56.0" "PyMuPDF>=1.24,<2"
          python -m playwright install --with-deps chromium
      - name: Make Playwright Chromium available to existing test scripts
        run: |
          BROWSER_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          test -x "$BROWSER_PATH"
          if [ ! -e /usr/bin/chromium ]; then
            sudo ln -s "$BROWSER_PATH" /usr/bin/chromium
          fi
          /usr/bin/chromium --version
      - name: Run browser and PDF regressions
        run: npm run test:browser
