.candidate-setup{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:14px;margin:16px 0}
.candidate-setup label,.ballot-card label{display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:750;color:var(--text-secondary,#586477)}
.candidate-setup input,.candidate-setup select,.ballot-card input:not([type=checkbox]),.ballot-card textarea{background:var(--card,#fff);border:1px solid var(--border,#e4e8ef);border-radius:9px;padding:10px 11px;color:var(--text,#25334b);font:inherit;font-size:14px;width:100%;min-width:0;outline-offset:2px}
.candidate-setup select{min-width:0;max-width:100%}
.candidate-checkbox{display:flex;align-items:center;gap:9px;margin:12px 0;font-size:13px;font-weight:600}
.candidate-threshold{font-size:13px;margin-top:12px;color:var(--text-secondary,#596575);line-height:1.6}
.candidate-hint{font-size:13px;line-height:1.6;color:var(--text-secondary,#596575);background:#f4f7fc;padding:12px 15px;border-radius:9px}
.candidate-hint code{color:#223f69;background:#e6ecf5;border-radius:4px;padding:2px 4px}
.ballot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px;margin:18px 0}
.ballot-card{border:1px solid #dae3ee;border-radius:12px;padding:16px;background:#fbfcff;display:flex;flex-direction:column;gap:12px;min-width:0}
.ballot-number{color:#34649a;font-size:11px;font-weight:800;letter-spacing:.10em}
.ballot-card textarea{resize:vertical;line-height:1.55;min-height:130px}
.ballot-options{display:flex;flex-wrap:wrap;gap:14px}.ballot-options label{display:flex;flex-direction:row;align-items:center;gap:7px;font-size:11px}
.candidate-footer{display:flex;align-items:center;flex-wrap:wrap;gap:13px;margin:15px 0 0}.candidate-footer>span{font-size:12px;color:#647489}
.candidate-blank{padding:24px;border:1px dashed #c6d3e4;border-radius:12px;color:#596b82;line-height:1.5}
.candidate-results{margin-top:22px}.candidate-result-table{overflow:auto;margin:18px 0}.candidate-result-table table{border-collapse:collapse;width:100%;font-size:13px}.candidate-result-table th,.candidate-result-table td{border-bottom:1px solid #e8ecf2;padding:11px 10px;text-align:left;vertical-align:top}.candidate-result-table th{background:#f4f7fb;color:#4a5b6f}.candidate-result-table td small{display:block;color:#8490a1;max-width:280px;overflow-wrap:anywhere;font-size:11px;margin-top:4px}
.candidate-outcome{border:1px solid #e2e8f1;border-radius:9px;margin:8px 0;overflow:hidden}.candidate-outcome>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 15px;cursor:pointer;background:#f9fbfe;font-size:13px}.candidate-outcome>summary::-webkit-details-marker{display:none}.candidate-outcome>summary>span{color:#596a80}.outcome-inner{padding:14px 16px}.outcome-inner>p{font-size:12px;color:#647389;margin:14px 0 0}.candidate-trace>div{padding:9px 4px;border-bottom:1px solid #f1f3f7;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px}.candidate-trace>div>span{min-width:105px;color:#4e6080}.candidate-trace>div>small{margin-left:auto;color:#7d8896}.trace-error,.error-inline{color:#ad2f39;background:#fff4f4;padding:12px;border-radius:9px;margin:12px 0;font-size:13px}
@media(max-width:1050px){.candidate-setup{grid-template-columns:1fr 1fr}}@media(max-width:600px){.candidate-setup{grid-template-columns:1fr}.candidate-outcome>summary{align-items:flex-start;flex-direction:column}}

/* 4.0 continuation — decision-support and privacy */
.influence-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;padding:18px}
.influence-group{border:1px solid var(--border,#e1e5ed);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.influence-numbers{display:flex;gap:7px;flex-direction:column;font-size:.85rem;color:var(--muted,#64748b)}
.influence-table th,.influence-table td{vertical-align:top;text-align:left;min-width:130px}
.influence-table td{line-height:1.8}.influence-table small{display:block;font-weight:400;font-size:.75rem;opacity:.7}
.influence-tips{padding:6px 22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 20px}
.influence-tips p{font-size:.9rem;line-height:1.6}
.telemetry-consent{display:flex;align-items:center;gap:10px;margin:18px 0 12px;font-weight:600;cursor:pointer}
.telemetry-consent input{width:17px;height:17px}
.privacy-actions{margin:14px 0}

.negotiation-selectors{padding:18px 22px;display:flex;flex-wrap:wrap;gap:20px}.negotiation-selectors label{display:flex;flex-direction:column;gap:7px;font-size:.85rem;min-width:230px;flex:1}.negotiation-selectors select{padding:10px;border-radius:8px;border:1px solid #d1d5db;background:var(--surface,#fff);color:inherit}
.negotiation-grid{padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:15px}
.negotiation-group{border:1px solid #dce2eb;border-radius:12px;padding:16px}.negotiation-group h3{margin:0;font-size:1rem}.negotiation-group>p{font-size:.82rem;color:#65758b}.negotiation-top{display:flex;gap:8px;justify-content:space-between;align-items:center}.negotiation-top .status-pill{white-space:nowrap}
.negotiation-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:11px 0;padding-bottom:8px;border-bottom:1px solid #e6eaf0}.negotiation-row>span{display:flex;align-items:center;gap:8px;font-size:.85rem}.negotiation-row .party-chip{pointer-events:none}.negotiation-row input{width:72px;padding:8px;border:1px solid #c9d2df;border-radius:8px;background:var(--surface,#fff);color:inherit}

/* Politikverkstan 0.5 — restrained deep-blue/yellow design refresh. */
:root{--ink:#17233b;--muted:#6f7d92;--border:#dfe6f0;--blue:#315eab;--accent:#284c90;--sidebar:#141b4d;--card:#fff;background:#f7f9fd}
.sidebar{background:#141b4d;color:#dbe4fb;box-shadow:7px 0 30px #16204d0e}
.brand-mark{background:#f2c94c;border-color:#f2c94c;color:#141b4d;box-shadow:none;border-radius:13px;font-size:22px}
.brand-title{color:#fff;letter-spacing:-.5px}.brand-caption{color:#b9c6e7}
.side-section-label{color:#8f9fc7}.nav-link{color:#c0cbe7;border-radius:10px}
.nav-link.active{background:#34427b;box-shadow:inset 3px 0 #f2c94c}
.nav-link:not(.active):hover{background:#29346b}.sidebar-bottom{border-top:1px solid #40507d}
.side-dot{background:#f2c94c;box-shadow:0 0 0 4px #594e39}
.topbar{border-bottom-color:#dce3f0;box-shadow:0 2px 9px #0f244009}
.primary-button{background:#141b4d;border-color:#141b4d;box-shadow:0 4px 12px #1e2e6540}
.primary-button:hover{background:#2c3c82}.page-head h1{color:#17234a}
.overline{color:#5266a0}.stat-value{color:#1a2654}.main-card,.stat{border-radius:15px;box-shadow:0 8px 28px #17366008}
.coalition-card{background:#fafbff;border-radius:13px}.coalition-card:hover{border-color:#7b92c5}
.coalition-card.drag-over,.new-coalition.drag-over{background:#fef8e7;border-color:#d8ad25}
.coalition-strength,.coalition-title{color:#17254b}.seat-strong,.compact-value{color:#2b5793}
.portal-workroom{padding:17px 12px 19px;background:#212c68;border:1px solid #40518c;border-radius:12px;margin-top:27px}
.portal-workroom>span{font-size:9px;font-weight:900;letter-spacing:1.1px;color:#a8b9e4}
.portal-workroom a{margin-top:10px;color:#ffdf78;font-weight:800;text-decoration:none;display:flex;justify-content:space-between;font-size:12px}
.portal-workroom a:hover{color:white}.portal-workroom small{color:#bec9e4;font-size:10px;display:block;margin-top:9px}
.header-button.workroom-shortcut{text-decoration:none;color:#253c74;border:1px solid #d8dff1;background:#f5f7ff}
.header-button.workroom-shortcut:hover{background:#e9edfc}
@media(max-width:1060px){.portal-workroom{margin-top:14px}.workroom-shortcut{display:none}}

  if(!names.length)warnings.push(`Valsedel ${index+1}: inga beaktade namn finns kvar (10 §).`);
  const key=JSON.stringify([label,names]);if(groups.has(key))groups.get(key).votes+=count;
  else groups.set(key,{id:`G${groups.size+1}`,label,names,votes:count,ballotRows:[index+1]});
 }
 if(!valid)throw Error('Inga giltiga röster finns');
 if(opts.present!==undefined){safeInt(opts.present,'Närvarande väljande',false);if(cast>opts.present)throw Error(`Antal avgivna valsedlar (${cast}) överstiger närvarande väljande (${opts.present})`);}
 const result=[...groups.values()];
 // Tvinga inte samman två valsedelsgrupper endast för att de har samma gruppbeteckning.
 if(result.some(g=>g.votes===0))warnings.push('Valsedelsgrupper utan röster påverkar inte resultatet.');
 return {seats,groups:result,people:Object.fromEntries(people),cast,valid,invalid:ignored,warnings,threshold:opts.present?E.threshold(opts.present,seats):null};
}
function countedShares(state,groups){
 const frequencies=new Map();for(let i=0;i<groups.length;i++)for(const name of groups[i].names.slice(0,state.counts[i]))frequencies.set(name,(frequencies.get(name)||0)+1);
 return groups.map((g,i)=>g.names.slice(0,state.counts[i]).reduce((a,name)=>E.plus(a,E.frac(1n,BigInt(frequencies.get(name)))),E.zero()));
}
function rank(state,groups){
 const effective=countedShares(state,groups),quotients=[];let best=null,winning=[];
 for(let i=0;i<groups.length;i++){
  const g=groups[i];if(!g.votes||state.counts[i]>=g.names.length){quotients.push(null);continue;}
  const divisor=E.plus(effective[i],E.one());const q=E.over(E.frac(BigInt(g.votes)),divisor);quotients.push(q);
  if(best===null||E.cmp(q,best)>0){best=q;winning=[i];}else if(E.cmp(q,best)===0)winning.push(i);
 }
 return {winning,quotients,effective};
}
function keyOf(s){return s.counts.join(',')+'|'+Object.keys(s.firstByPerson).sort().map(k=>JSON.stringify([k,s.firstByPerson[k]])).join(';');}
function compute(ballots,options){
 const {maxStates=30000}=options||{};
 const prep=prepare(ballots,options);
 const {groups,seats}=prep;let states=new Map();
 const initial={counts:groups.map(()=>0),firstByPerson:{},prob:E.one(),trace:[]};
 // Vid val av en enda plats anger 16 § att högsta röstetal avgör. Om en sådan
 // grupp saknar beaktade namn kan vi inte säkert besätta platsen med nästa grupp.
 const highest=Math.max(...groups.map(g=>g.votes));
 if(seats===1&&groups.some(g=>g.votes===highest&&!g.names.length)){initial.incomplete=true;initial.trace=[{seat:1,error:'Högst röstetal förekommer på en valsedelsgrupp utan beaktade namn. Kräver prövning; ingen vinnare antas.'}];}
 states.set(keyOf(initial),initial);
 const steps=[];let truncated=false;
 for(let seat=0;seat<seats;seat++){
  const next=new Map();const ties=new Set();let ended=0;
  for(const s of states.values()){
   if(s.incomplete){const k=keyOf(s);const old=next.get(k);if(old)old.prob=E.plus(old.prob,s.prob);else next.set(k,s);continue;}
   const {winning,quotients,effective}=rank(s,groups);
   if(!winning.length){ended++;const endedState={...s,incomplete:true,trace:[...s.trace,{seat:seat+1,error:'Ingen valsedelsgrupp med återstående namn kunde få fler platser'}]};const k=keyOf(endedState),old=next.get(k);if(old)old.prob=E.plus(old.prob,s.prob);else next.set(k,endedState);continue;}
   if(winning.length>1)ties.add(winning.map(i=>groups[i].id).join('+'));
   const part=E.over(s.prob,E.frac(winning.length));
   for(const i of winning){
    const counts=s.counts.slice();const name=groups[i].names[counts[i]];counts[i]++;
    const firstByPerson={...s.firstByPerson};if(!firstByPerson[name])firstByPerson[name]=groups[i].id;
    const ns={counts,firstByPerson,prob:part,trace:[...s.trace,{seat:seat+1,groupId:groups[i].id,groupLabel:groups[i].label,personId:name,personName:prep.people[name].name,tie:winning.length>1,drawAgainst:winning.map(j=>groups[j].id),comparison:E.simple(quotients[i]),effectiveSeats:E.simple(effective[i])}]};
    const key=keyOf(ns),old=next.get(key);if(old)old.prob=E.plus(old.prob,part);else next.set(key,ns);
   }
  }
  if(next.size>maxStates)throw Error(`Exakt beräkning kräver mer än ${maxStates} tillstånd. Minska antalet listor eller platser.`);
  states=next;steps.push({seat:seat+1,ties:[...ties],states:states.size,unfinished:ended});
  if([...states.values()].every(s=>s.incomplete)){truncated=true;break;}
 }
 const outcomes=[...states.values()].map(s=>({counts:s.counts,firstByPerson:s.firstByPerson,prob:s.prob,trace:s.trace,incomplete:!!s.incomplete}));
 const checksum=outcomes.reduce((sum,o)=>E.plus(sum,o.prob),E.zero());if(E.cmp(checksum,E.one())!==0)throw Error('Sannolikhetskontroll misslyckades');
 const distributions=groups.map((g,i)=>{const map=new Map();for(const o of outcomes)map.set(o.counts[i],E.plus(map.get(o.counts[i])||E.zero(),o.prob));return [...map].sort((a,b)=>a[0]-b[0]).map(([places,prob])=>({places,prob}));});
 const elected=outcomes.map(o=>({prob:o.prob,people:Object.keys(o.firstByPerson).map(id=>({id,name:prep.people[id].name,firstGroup:o.firstByPerson[id]}))}));
 return {...prep,groups,distributions,outcomes,elected,steps,exact:true,complete:!truncated&&!outcomes.some(o=>o.incomplete),incompleteWarning:outcomes.some(o=>o.incomplete)?'Vissa platser kunde inte besättas med tillgängliga namnlistor. Resultatet är inte fullständigt.':null,assumption:'Likformiga lottningsutfall är ett redovisat simuleringsantagande, inte en juridiskt garanterad sannolikhet.',modelVersion:VERSION};
}
function alternativeOrder(member,memberGroup,substituteResult,unavailable=[]){
 // 22 § avser proportionalvalda ersättare. Angivna valsedelsgrupper + först tilldelande grupp krävs.
 if(!substituteResult||!substituteResult.groups||!substituteResult.outcomes)throw Error('Ersättarval måste vara beräknat');
 const blocked=new Set([...unavailable,String(member)]);
 const out=[];
 for(const state of substituteResult.outcomes){
  const groups=substituteResult.groups;
  const assigned=groups.map((g,i)=>({group:g,candidates:g.names.slice(0,state.counts[i]).map((person,index)=>({id:person,position:index,first:state.firstByPerson[person]})).filter(p=>p.first===g.id&&!blocked.has(p.id))}));
  const same=assigned.filter(x=>x.group.label===memberGroup);
  const other=assigned.filter(x=>x.group.label!==memberGroup).sort((a,b)=>b.group.votes-a.group.votes);
  // Under 22 § är ordningen mellan ersättargrupper med samma röstetal en ytterligare lottningsfråga.
  const ties=other.some((g,i)=>i&&other[i-1].group.votes===g.group.votes);
  const candidates=[...same,...other].flatMap(x=>x.candidates.map(p=>({name:substituteResult.people[p.id]?.name||p.id,id:p.id,groupLabel:x.group.label,groupVotes:x.group.votes})));
  out.push({prob:state.prob,candidates,tieOnPriority:ties});
 }
 return out;
}
return {VERSION,prepare,compute,countedShares,rank,alternativeOrder};
});

function previewMerged(groups,i,j){const combined=E.mergeGroupSets(groups,i,j);const a=groups[i],b=groups[j];const merged=combined.find(g=>g.parties.length===a.parties.length+b.parties.length && [...g.parties].sort().join(',')===[...a.parties,...b.parties].sort().join(',')); const base=current().results;let changed=[];let deltaTotal=E.zero();
 const bySeat=new Map();for(const {org,main} of Object.values(base)){
  if(parentMap[org.id])continue;const mergedResult=bySeat.get(org.seats)||E.allocate(combined,org.seats);bySeat.set(org.seats,mergedResult);
  const idx=combined.findIndex(g=>g.id===merged.id),oldA=groups.findIndex(g=>g.id===a.id),oldB=groups.findIndex(g=>g.id===b.id);
  const old=E.plus(main.expected[oldA],main.expected[oldB]); const diff=E.minus(mergedResult.expected[idx],old);
  if(E.cmp(diff,E.zero())!==0)changed.push({name:org.name,delta:diff,seats:org.seats});
  deltaTotal=E.plus(deltaTotal,diff);
 }
 return {groups:combined,merged,changed,deltaTotal};}
function mergersPage(){const {groups}=current();if(groups.length<2)return `${headline('ALTERNATIVA KONSTELLATIONER','Möjliga sammanslagningar','Alla partier ligger redan i samma kartell.')}${workspaceShortcut()}`;
 const combos=[];for(let i=0;i<groups.length;i++)for(let j=i+1;j<groups.length;j++){const out=previewMerged(groups,i,j);combos.push({i,j,a:groups[i],b:groups[j],...out});}
 const impacted=combos.filter(a=>a.changed.length);impacted.sort((a,b)=>b.changed.length-a.changed.length||Math.abs(Number(b.deltaTotal.n)/Number(b.deltaTotal.d))-Math.abs(Number(a.deltaTotal.n)/Number(a.deltaTotal.d)));
 return `${headline('KARTELLANALYS','Möjliga sammanslagningar','Så förändras förväntade platser när två valtekniska grupper går samman. Effekten är matematisk, inte en prognos för vilka som kommer samarbeta.')}<div class="info-strip">${icon('info',18)} <span>Analysen jämför nuvarande scenario med alla ${combos.length} möjliga sammanslagningar av <strong>två befintliga karteller</strong>. ${impacted.length} påverkar platsfördelningen i något direkt valt organ.</span></div><div class="merger-list">${(impacted.length?impacted:combos).map((c,index)=>`<article class="merger-card"><div class="merger-top"><div class="merger-icon">${icon('layers',21)}</div><div class="merger-title"><h3>${escapeHtml(groupName(c.a))} <span>+</span> ${escapeHtml(groupName(c.b))}</h3><p>${c.a.votes} + ${c.b.votes} = ${c.merged.votes} mandat</p></div><span class="effect-chip">${c.changed.length} organ påverkas</span></div><div class="merger-content"><div class="impact-heading">Förändring av gemensamt förväntat platsantal</div>${c.changed.length?c.changed.map(t=>`<div class="impact-row"><span>${escapeHtml(t.name)}</span><strong class="${E.cmp(t.delta,E.zero())>0?'positive':'negative'}">${netText(t.delta)} platser</strong></div>`).join(''):'<div class="muted small-copy">Inga förändringar i de direktvalda organ som analyseras.</div>'}<div class="merger-footer"><button class="small-button" data-merge="${c.i}:${c.j}">Använd denna sammanslagning ${icon('arrow',15)}</button></div></div></article>`).join('')}</div>`;}

function legalPage(){return `${headline('KÄLLOR OCH AVGRÄNSNINGAR','Metod & transparens','Här beskrivs vad programmet faktiskt beräknar, vilka regler som används och vad som måste kontrolleras innan siffrorna kan användas i ett formellt val.')}<div class="legal-grid"><section class="main-card"><h2>Detta kan motorn beräkna</h2><p>Förenklad mandatbaserad gruppfördelning med ett jämförelsetal som motsvarar röstetalet dividerat med redan tilldelade platser plus ett. Alla exakta lika jämförelsetal grenas till olika lottningsutfall.</p><p>Beräkningarna använder <strong>BigInt och exakta rationella tal</strong>, utan att avrundning påverkar platsfördelningen.</p><p>Utskott kan simuleras genom att samtliga möjliga utfall i överordnat organ följs upp som separata grenar. Resultatet är fortfarande ett hypotetiskt scenario.</p></section><section class="main-card"><h2>Detta ingår ännu inte</h2><p>Kandidatbaserade valsedlar och specialregeln för kandidater på flera listor finns nu som separat simuleringsläge. Fullständig juridisk verifiering av alla tolknings- och tillämpningsfall saknas fortfarande. Systemet kan därför inte användas som en verifierad juridisk valförrättare.</p><p>Faktiskt beslutad ersättarordning, kontrollerad personvalbarhet, bolagsordningar, presidieposter och samtliga särskilda tillsättningsregler ingår inte i beräkningsmotorn.</p><p>Kartellmatrisen är därför fortfarande märkt som <strong>förenklad simulering</strong>; kandidatvyn är en särskild hypotetisk juridisk valberäkning.</p></section><section class="main-card"><h2>Tröskel för proportionellt val</h2><p>2 § lagen (2022:629) anger att antalet väljande som behöver begära ett proportionellt val är antalet närvarande ledamöter dividerat med antalet personer valet avser plus ett, avrundat uppåt.</p><label class="number-control">Närvarande väljande <input id="present-input" type="number" min="1" max="70" value="${state.present}"></label><div class="threshold-grid">${[13,9,6,5,3,1].map(n=>`<div><span>${n} platser</span><strong>${E.threshold(state.present,n)} röster</strong></div>`).join('')}</div><p>3 § begränsar proportionella ersättarval till fall då ledamotsvalet varit proportionellt.</p></section><section class="main-card"><h2>Primärkällor</h2><p><a href="https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/lag-2022629-om-proportionella-val-i-kommuner_sfs-2022-629/" target="_blank" rel="noopener">Lag (2022:629) om proportionella val i kommuner och regioner ↗</a></p><p><a href="https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/kommunallag-2017725_sfs-2017-725/" target="_blank" rel="noopener">Kommunallag (2017:725), bland annat 5 kap. 58 § ↗</a></p><p><a href="https://www.val.se/" target="_blank" rel="noopener">Valmyndigheten – kontroll av mandatfördelning ↗</a></p><p><a href="https://meetings.lekeberg.se/" target="_blank" rel="noopener">Lekebergs protokoll och beslutsunderlag ↗</a></p><p>Lokalt underlag: 57 uppdrag i Excel samt kommunens allmänna reglemente, fastställt 2025-03-03. Senare beslut kan ha ändrat sammansättningen.</p></section></div><div class="bottom-alert">${icon('info',18)} <div><strong>Tolka resultaten korrekt</strong><p>”Säker plats” betyder att gruppen får platsen i samtliga lottningsgrenar under modellens förutsättningar. Det betyder inte en juridiskt garanterad rätt eller ett verifierat faktiskt valresultat.</p></div></div>`;}
function namesFromInput(raw){
 return String(raw||'').split(/\r?\n/).map(line=>line.trim()).filter(Boolean).map((line)=>{
  const struck=line.startsWith('-');if(struck)line=line.slice(1).trim();
  const unknown=line.endsWith('[okänd]');if(unknown)line=line.slice(0,-7).trim();
  const ineligible=line.endsWith('[ej valbar]');if(ineligible)line=line.slice(0,-11).trim();
  const unidentifiable=line.endsWith('[oklar identitet]');if(unidentifiable)line=line.slice(0,-17).trim();
  const orderUnclear=line.endsWith('[oklar ordning]');if(orderUnclear)line=line.slice(0,-15).trim();
  const split=line.indexOf('::');const id=split>=0?line.slice(0,split).trim():line;
  const name=split>=0?line.slice(split+2).trim():line;
  return {id,name,struck,eligible:unknown?'unknown':!ineligible,identifiable:!unidentifiable,orderClear:!orderUnclear};
 });
}

 ${limited?`<p class="small-copy">Endast de första ${maxOutcomes} utfallen visas här. Alla ${r.outcomes.length} utfall ingår i beräkningen.</p>`:''}
 </div>`;
}

function influencePage(){

 }).join('');

 return `${headline('POLITISK STYRNING','Inflytande & handlingsutrymme','Analysera möjliga beslutsmajoriteter, proportionella val och beroenden. Alla sannolikheter avser lottning enligt den förenklade mandatmodellen.')}

function negotiationPage(){
 const available=['org03','org07','org05','org09','org10'].filter(id=>!!current().results[id]);
 if(!available.length)return `${headline('POLITISKA ÖVERENSKOMMELSER','Förhandlingsverkstad','Aktivera minst ett organ i organisationsregistret för att arbeta med dess fördelning.')}`;

 let stored=state.negotiations[id]||{};let idx=outcomes.findIndex(o=>o.allocation.join(',')===stored.key);if(idx<0)idx=0;

 }).join('');
 const sums=groups.map(g=>g.parties.reduce((a,p)=>a+(Number.isInteger(assignments[p])?assignments[p]:0),0));

}

async function sendTelemetry(){

  state.telemetryInfo='En aggregerad observation har registrerats. Ingen IP-adress eller kandidatlista skickades som fält.';

}

 document.querySelectorAll('[data-merge]').forEach(b=>b.addEventListener('click',()=>{const [i,j]=b.dataset.merge.split(':').map(Number);const {groups}=current();const a=groups[i],c=groups[j];transact('merge',l=>{const del=new Set([...a.parties,...c.parties]);for(const p of del)for(const row of l){const idx=row.indexOf(p);if(idx>=0)row.splice(idx,1);}l.push([...del]);});}));
 document.querySelectorAll('[data-org-toggle]').forEach(b=>b.addEventListener('change',()=>{if(b.checked){if(!state.enabled.includes(b.dataset.orgToggle))state.enabled.push(b.dataset.orgToggle);}else state.enabled=state.enabled.filter(x=>x!==b.dataset.orgToggle);if(!primaryIds.has(b.dataset.orgToggle)&&!parentMap[b.dataset.orgToggle]&&b.checked){state.error='Denna organisation är inte juridiskt kartlagd. Beräkningen är en hypotetisk gruppfördelning.';}memoKey=null;persistDraft();render();}));
 const e=el('search-org');if(e)e.addEventListener('input',()=>{const q=e.value.toLowerCase();let count=0;document.querySelectorAll('.registry-row').forEach(row=>{const show=row.dataset.name.includes(q);row.style.display=show?'':'none';if(show)count++;});el('org-count').textContent=count;});
 const name=el('scenario-name');if(name)name.addEventListener('input',()=>{state.title=name.value;persistDraft();});
 const present=el('present-input');if(present)present.addEventListener('change',()=>{let v=Number(present.value);if(!Number.isInteger(v)||v<1||v>70){state.error='Ange 1–70 närvarande väljande.';render();return;}state.present=v;persistDraft();render();});
 const compact=el('compact-toggle');if(compact)compact.addEventListener('change',()=>{state.compact=compact.checked;render();});
 const save=el('save-btn');if(save)save.addEventListener('click',saveScenario);
 const inner=el('save-inner');if(inner)inner.addEventListener('click',saveScenario);
 const share=el('share-btn');if(share)share.addEventListener('click',shareScenario);
 const undoBtn=el('undo-btn');if(undoBtn)undoBtn.addEventListener('click',undo);
 const redoBtn=el('redo-btn');if(redoBtn)redoBtn.addEventListener('click',redo);
 const exportJson=el('export-json');if(exportJson)exportJson.addEventListener('click',()=>downloadFile('mandatportal-scenario.json',JSON.stringify(scenarioData(),null,2),'application/json'));
 const exportCsv=el('export-csv');if(exportCsv)exportCsv.addEventListener('click',exportCSV);
 const importJson=el('import-json');if(importJson)importJson.addEventListener('click',()=>el('file-import').click());
 document.querySelectorAll('[data-open-save]').forEach(b=>b.addEventListener('click',()=>loadScenario(saved[Number(b.dataset.openSave)])));
 document.querySelectorAll('[data-compare-save]').forEach(b=>b.addEventListener('click',()=>{state.savedView=Number(b.dataset.compareSave);render();}));
 document.querySelectorAll('[data-delete-save]').forEach(b=>b.addEventListener('click',()=>{let i=Number(b.dataset.deleteSave);if(!confirm('Ta bort det sparade scenariot?'))return;saved.splice(i,1);storeSaved();state.savedView=null;render();}));
 const closeCompare=el('close-compare');if(closeCompare)closeCompare.addEventListener('click',()=>{state.savedView=null;render();});
 const backdrop=el('drawer-backdrop'),close=el('close-drawer');if(backdrop)backdrop.addEventListener('click',closeDrawer);if(close)close.addEventListener('click',closeDrawer);
 const dismiss=el('dismiss-error');if(dismiss)dismiss.addEventListener('click',()=>{state.error='';render();});
 const negOrg=el('neg-org');if(negOrg)negOrg.addEventListener('change',()=>{state.negotiationOrg=negOrg.value;render();});
 const negOutcome=el('neg-outcome');if(negOutcome)negOutcome.addEventListener('change',()=>{const id=el('neg-org').value;const outcome=current().results[id].main.outcomes[Number(negOutcome.value)];state.negotiations[id]={key:outcome.allocation.join(','),assignments:{}};persistDraft();render();});
 document.querySelectorAll('[data-neg-party]').forEach(inp=>inp.addEventListener('change',()=>{const id=el('neg-org').value;const outcomes=current().results[id].main.outcomes;const index=Number(el('neg-outcome').value);const chosen=outcomes[index];let old=state.negotiations[id];if(!old||old.key!==chosen.allocation.join(','))old={key:chosen.allocation.join(','),assignments:{}};const n=Number(inp.value);if(!Number.isSafeInteger(n)||n<0||n>chosen.allocation.reduce((a,b)=>a+b,0)){state.error='Ange ett giltigt helt antal platser';render();return;}old.assignments[inp.dataset.negParty]=n;state.negotiations[id]=old;persistDraft();render();}));
 const negClear=el('neg-clear');if(negClear)negClear.addEventListener('click',()=>{delete state.negotiations[el('neg-org').value];persistDraft();render();});
 const consent=el('telemetry-consent');if(consent)consent.addEventListener('change',()=>{state.telemetryConsent=consent.checked;state.telemetryInfo='';render();});
 const send=el('send-telemetry');if(send)send.addEventListener('click',sendTelemetry);
 const mobile=el('mobile-toggle');if(mobile)mobile.addEventListener('click',()=>document.querySelector('.sidebar').classList.toggle('visible'));
}
function closeDrawer(){state.drawer=null;render();}
function newCoalitionDialog(){const groups=current().groups;showModal(`<div class="modal-title">Skapa en ny kartell</div><p>Välj ett parti som ska flyttas till en egen kartell.</p><div class="move-options">${Object.keys(P).filter(p=>groups.find(g=>g.parties.includes(p)).parties.length>1).map(p=>`<button data-choose-new="${p}">${escapeHtml(P[p].name)}<span>${P[p].seats} mandat</span></button>`).join('')||'<p>Alla partier har redan egna karteller.</p>'}</div>`);document.querySelectorAll('[data-choose-new]').forEach(b=>b.addEventListener('click',()=>{moveParty(b.dataset.chooseNew,'new');closeModal();}));}
function partyMoveDialog(p){const groups=current().groups;const body=`<div class="modal-title">Flytta ${escapeHtml(P[p].name)}</div><p>Välj vilken kartell partiet ska tillhöra.</p><div class="move-options">${groups.filter(g=>!g.parties.includes(p)).map(g=>`<button data-destination="${g.id}">${escapeHtml(groupName(g))}<span>${g.votes} mandat</span></button>`).join('')}<button data-destination="new">${icon('plus',17)} Ny egen kartell</button></div>`;showModal(body);document.querySelectorAll('[data-destination]').forEach(b=>b.addEventListener('click',()=>{moveParty(p,b.dataset.destination);closeModal();}));}
function showModal(body){let overlay=document.createElement('div');overlay.className='modal-overlay';overlay.id='app-modal';overlay.innerHTML=`<div class="modal"><button id="modal-close" class="close-button" aria-label="Stäng">${icon('close',18)}</button>${body}</div>`;document.body.append(overlay);overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});el('modal-close').addEventListener('click',closeModal);}
function closeModal(){el('app-modal')?.remove();}
function storeSaved(){try{localStorage.setItem('mandatportal-saved',JSON.stringify(saved));}catch{state.error='Webbläsaren tillåter inte lagring. Exportera scenariot som JSON.';}}
function saveScenario(){let name=prompt('Namn på scenariot:',state.title);if(name===null)return;state.title=(name.trim()||'Namnlöst scenario').slice(0,90);saved.unshift(scenarioData());saved=saved.slice(0,60);storeSaved();persistDraft();state.selected='compare';render();}
function loadScenario(s){if(!s)return;try{state.history=[];state.future=[];state.layout=sanitizeLayout(s.layout);state.title=String(s.title||'Importerat scenario').slice(0,90);state.enabled=(s.enabled||[...defaultActive]).filter(x=>primaryIds.has(x)||parentMap[x]);state.present=Number(s.present)||35;state.selected='workspace';state.savedView=null;state.negotiations=(s.negotiations&&typeof s.negotiations==='object'&&!Array.isArray(s.negotiations))?s.negotiations:{};if(s.candidateData){state.candidateOrg=lookup(s.candidateData.org)?s.candidateData.org:'org03';state.candidateRole=s.candidateData.role==='subs'?'subs':'main';state.candidateSeats=Number(s.candidateData.seats)||13;state.candidatePresent=Number(s.candidateData.present)||35;state.candidateMemberProportional=!!s.candidateData.memberProportional;state.candidateRows=Array.isArray(s.candidateData.rows)?s.candidateData.rows.slice(0,100):[];state.candidateResult=null;}memoKey=null;persistDraft();render();}catch(e){state.error='Scenariot kunde inte läsas: '+e.message;render();}}
function shareScenario(){if(location.protocol==='file:'||location.protocol==='about:'){showModal('<div class="modal-title">Dela scenariot</div><p>Den här versionen körs som en lokal fil. En delningslänk till filens adress fungerar inte för andra användare. Publicera HTML-filen på en HTTPS-adress för länkar, eller exportera scenariot som JSON och skicka filen.</p><button id="modal-export" class="primary-button">Exportera scenario som JSON</button>');el('modal-export').addEventListener('click',()=>{downloadFile('mandatportal-scenario.json',JSON.stringify(scenarioData(),null,2),'application/json');closeModal();});return;}const content={title:state.title,layout:state.layout,enabled:state.enabled,present:state.present};const json=JSON.stringify(content);const bytes=new TextEncoder().encode(json);let binary='';bytes.forEach(b=>binary+=String.fromCharCode(b));const code=btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');const url=location.href.split('#')[0]+'#s='+code;
 if(navigator.clipboard?.writeText)navigator.clipboard.writeText(url).then(()=>notice('Delningslänken har kopierats.')).catch(()=>showShareUrl(url));else showShareUrl(url);}
function showShareUrl(url){showModal(`<div class="modal-title">Dela scenario</div><p>Kopiera länken. Den innehåller endast scenarioinställningar, ingen privat anteckning.</p><textarea readonly rows="4" class="share-text">${escapeHtml(url)}</textarea><button class="primary-button" id="copy-link">Kopiera</button>`);el('copy-link').addEventListener('click',()=>{const area=document.querySelector('.share-text');area.select();document.execCommand('copy');closeModal();notice('Länken kopierades.');});}
function notice(message){const banner=document.createElement('div');banner.className='toast';banner.textContent=message;document.body.append(banner);setTimeout(()=>banner.remove(),2800);}
function downloadFile(filename,data,mime){const blob=new Blob([data],{type:mime+';charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportCSV(){const {groups,results}=current();let rows=[['Organ','Typ',...groups.map(groupName)]];for(const {org,main,subs} of Object.values(results)){rows.push([org.name,'Ordinarie',...main.expected.map(v=>E.simple(v))]);if(subs)rows.push([org.name,'Ersättare',...subs.expected.map(v=>E.simple(v))]);}const csv='\uFEFF'+rows.map(row=>row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n');downloadFile('mandatportal-resultat.csv',csv,'text/csv');}
function fromShared(){if(!location.hash.startsWith('#s='))return false;try{let b64=location.hash.slice(3).replace(/-/g,'+').replace(/_/g,'/');let bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));let s=JSON.parse(new TextDecoder().decode(bytes));state.layout=sanitizeLayout(s.layout);state.title=String(s.title||'Delat scenario');state.enabled=(s.enabled||[...defaultActive]).filter(x=>primaryIds.has(x)||parentMap[x]);state.present=Number(s.present)||35;memoKey=null;state.error='';return true;}catch(e){state.error='Delningslänken kunde inte läsas.';return false;}}
function render(){el('root').innerHTML=upperShell();bindPageActions();}
try{if(!fromShared()){let draft=JSON.parse(localStorage.getItem('mandatportal-draft')||'null');if(draft){state.layout=sanitizeLayout(draft.layout);state.title=draft.title||'Nytt scenario';state.enabled=(draft.enabled||[...defaultActive]).filter(x=>primaryIds.has(x)||parentMap[x]);state.present=Number(draft.present)||35;state.negotiations=(draft.negotiations&&typeof draft.negotiations==='object'&&!Array.isArray(draft.negotiations))?draft.negotiations:{};if(draft.candidateData){state.candidateOrg=lookup(draft.candidateData.org)?draft.candidateData.org:'org03';state.candidateRole=draft.candidateData.role==='subs'?'subs':'main';state.candidateSeats=Number(draft.candidateData.seats)||13;state.candidatePresent=Number(draft.candidateData.present)||35;state.candidateMemberProportional=!!draft.candidateData.memberProportional;state.candidateRows=Array.isArray(draft.candidateData.rows)?draft.candidateData.rows.slice(0,100):[];}}}}catch{}
el('file-import').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const content=JSON.parse(await file.text());loadScenario(content);notice('Scenario importerat.');}catch(err){state.error='Ogiltig JSON-fil: '+err.message;render();}e.target.value='';});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();if(state.drawer)closeDrawer();}if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!e.target.matches('input,textarea')){e.preventDefault();undo();}});
render();
})();
</script></body></html>
